name: Ingest Gmail → Supabase

on:
  # Cada 30 minutos en horario UTC.
  schedule:
    - cron: '*/30 * * * *'
  # Trigger manual desde la pestaña Actions de GitHub.
  workflow_dispatch:

# Solo una corrida a la vez; si llega otro tick mientras corre, lo encola.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Descargar correos y subir a Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: parsers/requirements.txt

      - name: Install dependencies
        working-directory: parsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingest
        working-directory: parsers
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingest_mail.py
